# VeeR (EH1/EL2) debug-module configuration.
# Expects $_TARGETNAME to have been created by the chain fragment.
# VeeR's debug module has no program buffer (progbufsize=0). System-bus access
# works while the CPU runs and reaches RAM and peripherals; abstract access
# also reaches the ICCM, DCCM and PIC, but only while the CPU is halted. Try
# the system bus first. Fences go through the custom dmst CSR.

riscv set_mem_access sysbus abstract

# Expose VeeR's custom dmst CSR (csr1988).
riscv expose_csrs 1988

# Execute fence + fence.i via dmst before running freshly loaded code.
proc pastel_veer_fence {} {
    reg csr1988 0x3
}
$_TARGETNAME configure -event resume-start { pastel_veer_fence }
$_TARGETNAME configure -event step-start   { pastel_veer_fence }
