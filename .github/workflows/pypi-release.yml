# Publishing soc-pastel. See "Releasing" in CONTRIBUTING.md.
#
# Publishing a GitHub Release (tag vX.Y.Z) builds the package once and checks
# it, then waits for a reviewer to approve the `pypi-release` environment
# before publishing to PyPI, and finally attaches the files to the GitHub
# Release.
#
# Running the workflow by hand (Actions > Release > Run workflow) builds and
# checks the chosen branch without publishing anything: a dry run.
#
# Uploads use PyPI trusted publishing: no API tokens are stored anywhere.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, which set the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Version
        id: version
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Built soc-pastel $version"
      - name: The version is the release's tag
        if: github.event_name == 'release'
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ "v${{ steps.version.outputs.version }}" != "$tag" ]; then
            echo "::error::built version ${{ steps.version.outputs.version }} doesn't match tag $tag (tags look like v0.1.0)"
            exit 1
          fi
      - name: The wheel works on its own
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/pastel list
          /tmp/smoke/bin/python -m pytest --pyargs soc_pastel.conformance --collect-only -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-release # its required reviewers are the approval step
      url: https://pypi.org/project/soc-pastel/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach:
    if: github.event_name == 'release'
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload to the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
