# pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc-pastel"
version = "0.0.1"
description = "PASTEL: Platform Agnostic Silicon Test Environment & Library (under development)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = ["Development Status :: 1 - Planning"]

[project.urls]
Homepage = "https://github.com/soc-puppets/soc-pastel"
